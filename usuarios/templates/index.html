{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clothes4Happiness</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #e6eef6;
        --border: #cddbe8;
        --text: #0f172a;
        --text-muted: #52657d;
        --accent: #2563eb;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 48px;
        letter-spacing: -0.01em;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 6px;
        height: 6px;
        background-color: #059669;
        border-radius: 50%;
      }

      main {
        max-width: 680px;
        margin: auto 0;
      }

      .badge {
        display: inline-block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-muted);
        margin-bottom: 24px;
        font-weight: 500;
      }

      h1 {
        font-size: clamp(38px, 6vw, 64px);
        font-weight: 500;
        line-height: 1.08;
        color: var(--text);
        letter-spacing: -0.03em;
        margin-bottom: 20px;
      }

      .lead {
        font-size: clamp(17px, 2.2vw, 21px);
        color: var(--text-muted);
        font-weight: 400;
        line-height: 1.5;
        max-width: 520px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 13px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        padding-top: 24px;
      }

      @media (max-width: 640px) {
        body {
          padding: 24px;
        }
        footer {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span>Clothes4Happiness</span>
      <div class="status">
        <span class="dot"></span>
        <span>Online</span>
      </div>
    </header>

    <main>
      <span class="badge">Ind&uacute;stria T&ecirc;xtil</span>
      <h1>Clothes4Happiness</h1>
      <p class="lead">
        Transforma&ccedil;&atilde;o Digital em vestu&aacute;rios.
      </p>
    </main>

    <footer>
      <span>Confec&ccedil;&atilde;o &amp; Tecnologia</span>
      <span>2026</span>
    </footer>
  </body>
</html>
